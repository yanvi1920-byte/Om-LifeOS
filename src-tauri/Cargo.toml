[package]
name = "lifeos"
version = "1.8.30"
description = "LifeOS — lightweight personal life management app"
authors = ["LifeOS"]
edition = "2021"

[lib]
name = "lifeos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.32.1", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target."cfg(windows)".dependencies]
rfd = "0.15"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-android-fs = { version = "29.0.0", features = ["legacy_storage_permission"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
