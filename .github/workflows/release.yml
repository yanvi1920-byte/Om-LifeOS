name: Build and release ॐ

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm install

      - name: Build Windows release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ॐ ${{ github.ref_name }}
          releaseBody: |
            ॐ LifeOS ${{ github.ref_name }}

            Windows installer release.
            Android signed APK and AAB are included when the Android build completes.
          releaseDraft: false
          prerelease: false
          args: "--target x86_64-pc-windows-msvc"

  android:
    name: Android
    runs-on: ubuntu-latest
    needs: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.0.13004108"

      - name: Setup Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install dependencies
        run: npm install

      - name: Initialize Android
        run: npx tauri android init --ci

      - name: Configure Android signing
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"

          cd src-tauri/gen/android

          {
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEY_PASSWORD"
            echo "storeFile=$RUNNER_TEMP/keystore.jks"
          } > keystore.properties

          cd ../../..

          python3 - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/gen/android/app/build.gradle.kts")
          text = path.read_text()

          if "import java.io.FileInputStream" not in text:
              text = "import java.io.FileInputStream\n" + text

          if "import java.util.Properties" not in text:
              text = "import java.util.Properties\n" + text

          signing_block = '''
          signingConfigs {
              create("release") {
                  val keystorePropertiesFile = rootProject.file("keystore.properties")
                  val keystoreProperties = Properties()

                  if (keystorePropertiesFile.exists()) {
                      keystoreProperties.load(FileInputStream(keystorePropertiesFile))
                  }

                  keyAlias = keystoreProperties["keyAlias"] as String
                  keyPassword = keystoreProperties["password"] as String
                  storeFile = file(keystoreProperties["storeFile"] as String)
                  storePassword = keystoreProperties["password"] as String
              }
          }

          '''

          if 'create("release")' not in text:
              if "buildTypes {" not in text:
                  raise SystemExit("ERROR: buildTypes block not found")

              text = text.replace(
                  "buildTypes {",
                  signing_block + "buildTypes {",
                  1
              )

          release_signing = 'signingConfig = signingConfigs.getByName("release")'

          if release_signing not in text:
              release_marker = 'getByName("release") {'

              if release_marker in text:
                  text = text.replace(
                      release_marker,
                      release_marker + "\n        " + release_signing,
                      1
                  )
              else:
                  text = text.replace(
                      "buildTypes {",
                      'buildTypes {\n        getByName("release") {\n            ' +
                      release_signing +
                      "\n        }",
                      1
                  )

          path.write_text(text)
          print("Android signing configuration applied successfully.")
          PY

      - name: Build Android AAB
        run: npm run tauri android build -- --aab --ci --target aarch64

      - name: Build Android APK
        run: npm run tauri android build -- --apk --ci --target aarch64

      - name: Verify Android APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk

      - name: Upload Android workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: om-lifeos-android-${{ github.ref_name }}
          path: |
            src-tauri/gen/android/app/build/outputs/**/*.aab
            src-tauri/gen/android/app/build/outputs/**/*.apk
          if-no-files-found: error

      - name: Upload signed Android files to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab" \
            "src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk" \
            --clobber
