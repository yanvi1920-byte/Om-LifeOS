<meta name="om-lifeos-structure" content="Dashboard;Tasks & Planner;Routine & Habits;Goals & Strategy;Focus;Notes;Journal;Finance;Calculator & Tools;Health;Work & Learning;People & Relationships;Values & Spiritual;Things & Documents;Settings">

<link rel="stylesheet" href="assets/style.css">
<style id="om-lifeos-final-polish">
/* Final v4.0.1 polish layer: accessibility, focus, overflow and touch safety. */
:where(button,a,input,select,textarea):focus-visible{
  outline:3px solid color-mix(in srgb,var(--accent,#5d57c9) 75%,white);
  outline-offset:2px;
}
button,a{min-height:36px}
button{touch-action:manipulation}
input,select,textarea{max-width:100%;box-sizing:border-box}
img,svg{max-width:100%}
.row,.actions,.card,.grid{min-width:0}
.row>*{min-width:0}
@media (max-width:700px){
  .actions{flex-wrap:wrap}
  .actions button,.actions a{flex:1 1 auto}
  .grid{grid-template-columns:1fr!important}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
}
</style>
<style id="om-lifeos-systematic-ui">
/* v4.1 systematic navigation + compact controls */
:root{--ui-radius:12px;--ui-gap:8px;--ui-control-h:40px}
.top{gap:10px}
.top-search{flex:1 1 280px;min-width:160px}
.top-actions{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.command-menu-wrap{position:relative}
.command-menu-trigger{min-height:38px;padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font-weight:800;display:inline-flex;align-items:center;gap:6px}
.command-menu-trigger:hover{border-color:var(--accent);background:var(--surface2)}
.command-menu{display:none;position:absolute;right:0;top:calc(100% + 7px);width:min(245px,calc(100vw - 24px));padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(15,23,42,.18);z-index:5000}
.command-menu.open{display:grid;gap:4px}
.command-menu button{width:100%;min-height:38px;padding:8px 10px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--text);text-align:left;font-weight:700}
.command-menu button:hover{background:var(--surface2);border-color:var(--line)}
#nav{display:grid;gap:5px}
.side{padding:9px}
.brand{margin-bottom:8px}
.card .form,.card .formgrid,.card .settings-left-stack,.card .actions,.card .row{min-width:0}
.form,.formgrid{gap:9px}
.form>label,.formgrid>label,.form label,.formgrid label{min-width:0}
.form>label,.formgrid>label{display:grid;gap:4px}
label{font-weight:700;color:var(--text)}
label .label,label>.label{color:var(--muted)}
input,textarea,select{min-height:40px;border-radius:9px;padding:8px 10px;box-shadow:0 1px 2px rgba(16,24,40,.025)}
textarea{min-height:96px;line-height:1.5}
input::placeholder,textarea::placeholder{color:#9aa2af}
select{cursor:pointer}
.rich-toolbar{padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);position:sticky;top:0;z-index:2}
.rich-toolbar button{background:var(--surface);box-shadow:0 1px 2px rgba(16,24,40,.04)}
.rich-editor{min-height:220px;border-radius:10px;padding:12px 13px;line-height:1.7;background:var(--surface)}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.actions button{min-height:36px}
.table-wrap{border:1px solid var(--line);border-radius:10px;overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:10px;color:var(--muted);text-align:left;background:var(--surface2)}
@media (max-width:1050px){
  .top{padding:9px 10px}
  #nav{gap:6px}
}
@media (max-width:760px){
  .top-search{width:100%;margin-top:7px;min-height:42px}
  .top-actions{position:absolute;right:10px;top:10px}
  .top>div:first-child{padding-right:115px}
  .command-menu-trigger{min-height:40px;padding:8px 9px;font-size:11px}
  .command-menu{right:0}
  .form,.formgrid{gap:8px}
  .rich-toolbar{position:static}
}
@media (max-width:430px){
  .top>div:first-child{padding-right:100px}
  .command-menu-trigger{font-size:10px;padding:7px 8px}
}
html[data-lifeos-mode="dark"] .command-menu{box-shadow:0 16px 36px rgba(0,0,0,.45)}
/* v4.2 universal control system: prevent browser-default buttons across every module */
button{
  appearance:none;
  -webkit-appearance:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  min-height:36px;
  padding:8px 11px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--surface2);
  color:var(--text);
  font:inherit;
  font-weight:650;
  line-height:1.2;
  text-align:center;
  text-decoration:none;
  white-space:normal;
  cursor:pointer;
  touch-action:manipulation;
  box-shadow:0 1px 1px rgba(16,24,40,.025);
  transition:background .15s ease,border-color .15s ease,box-shadow .15s ease,transform .05s ease;
}
button:hover{
  background:var(--surface);
  border-color:#bfc6d2;
  box-shadow:0 2px 6px rgba(16,24,40,.06);
}
button:active{transform:translateY(1px);}
button:disabled{opacity:.55;cursor:not-allowed;box-shadow:none;transform:none;}
button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:#5650bd;color:#fff;box-shadow:0 3px 9px rgba(93,87,201,.14);}
button.primary:hover{background:linear-gradient(135deg,#514bc4,#2f86ad);border-color:#514bc4;}
button.secondary{background:var(--surface);border-color:var(--line);color:#4d46a5;}
button.danger{background:#fff4f4;border-color:#efcccc;color:var(--red);}
button.full{width:100%;}
.actions>button{flex:0 1 auto;max-width:100%;}
.quick-capture-grid button,.calc-tools button,.calc-category-tabs button,.section-tabs button{min-width:0;}
@media(max-width:700px){
  button{min-height:40px;padding:9px 11px;}
  .actions>button{flex:1 1 140px;}
}
@media(max-width:430px){
  button{padding:8px 10px;font-size:12px;}
  .actions>button{flex-basis:120px;}
}
html[data-lifeos-mode="dark"] button{background:var(--surface2);color:var(--text);border-color:var(--line);}
html[data-lifeos-mode="dark"] button:hover{background:var(--surface);border-color:#596274;}
html[data-lifeos-mode="dark"] button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:#5650bd;}
html[data-lifeos-mode="dark"] button.danger{background:#321d20;color:#ffb4b4;border-color:#5d3034;}
</style>
<style id="om-lifeos-ultimate-responsive-layout">
/* ==========================================================
   Om-LifeOS v4.2 — Consolidated responsive layout system
   Compact packing, predictable action alignment, universal
   device behavior. This layer intentionally overrides legacy
   spacing/grid rules while keeping the data/application logic.
   ========================================================== */
:root{
  --layout-gap:10px;
  --layout-gap-sm:8px;
  --layout-pad:14px;
  --card-pad:12px;
  --control-h:38px;
}
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--text)}
.app{grid-template-columns:minmax(200px,218px) minmax(0,1fr);min-height:100dvh}
.side{min-width:0;overflow-y:auto;overflow-x:hidden}
.main{min-width:0;width:100%;padding:var(--layout-pad) var(--layout-pad) 24px;overflow:visible}
.content{width:100%;max-width:none;min-width:0}
.top{margin:0 0 var(--layout-gap);padding:10px 12px;gap:10px}

/* Flat sidebar — no dropdown groups. */
#nav{display:grid;gap:3px!important}
#nav .nav-app{
  width:100%;min-width:0;min-height:36px;padding:8px 10px;
  border:1px solid transparent;border-radius:9px;
  background:transparent;color:#bdc6d3;
  text-align:left;font-size:11.5px;font-weight:700;line-height:1.2;
  display:flex;align-items:center;justify-content:flex-start;
}
#nav .nav-app:hover{background:#1d2736;color:#fff;border-color:#2a3546}
#nav .nav-app.active{background:#302b55;border-color:#49427b;color:#fff;box-shadow:inset 2px 0 0 #8b84ee}

/* True compact packing container. JS computes safe positions per viewport. */
.grid.om-packed-grid{position:relative;display:block!important;width:100%;margin:0!important;padding:0!important}
.grid.om-packed-grid>.om-pack-item{
  position:absolute!important;top:0;left:0;margin:0!important;min-width:0;
  transition:none!important;
}
.grid.om-packed-grid>.om-pack-item>.grid{margin-bottom:0}

/* Cards: one consistent surface and no accidental vertical margins. */
.card,.hero,.module-hero,.note-card,.item,.routine,.kpi-box,.focus-stat,.badge,
.mentor-date-card,.mentor-quote-card,.ultra-main-card,.ultra-side-card{
  min-width:0;max-width:100%;
}
.card{padding:var(--card-pad)}
.card>h2{margin-bottom:7px}
.card>h3{margin-bottom:6px}
.card p{margin-bottom:6px}

/* All data rows: content on the left, amount/meta in the middle, actions at the far end. */
.row{display:flex;align-items:center;gap:8px;min-width:0;width:100%;padding:5px 0}
.row>span:first-child,.row>div:first-child{min-width:0;overflow-wrap:anywhere}
.row>.actions{margin-left:auto;flex:0 0 auto;min-width:max-content;justify-content:flex-end;align-items:center}
.row>.actions button{flex:0 0 auto}
.actions{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap;min-width:0;margin-top:7px}
.actions button{min-height:34px;padding:7px 10px;flex:0 0 auto}

/* Lists stay dense and don't create phantom blank regions. */
.list{display:grid;gap:4px;min-width:0}
.list>.row{border-bottom:1px solid color-mix(in srgb,var(--line) 72%,transparent)}
.list>.row:last-child{border-bottom:0}
.points{display:grid;gap:4px;margin:7px 0 8px;padding-left:18px}

/* Forms: controlled gaps instead of legacy stacking whitespace. */
.form,.formgrid{gap:7px}
.form>label,.formgrid>label,.note-category-row>label{min-width:0}
input,textarea,select{min-height:var(--control-h);padding:8px 9px;border-radius:8px}
textarea{min-height:86px}
button{min-height:34px}

/* Keep full-width controls truly full width only when the renderer asks for it. */
.full{grid-column:1/-1;width:100%}

/* Notes editor/list layout. */
.note-filter-bar{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,220px);gap:7px}
.note-category-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:7px;align-items:end}
.note-category-row .grow{min-width:0}
.note-category-chips,.chips{display:flex;gap:5px;flex-wrap:wrap}
.note-category-chips{max-height:84px;overflow:auto}
.note-card{padding:10px;break-inside:avoid;box-shadow:0 4px 16px rgba(17,24,39,.045)}
.note-card .row{padding:0;border:0}
.note-card .actions{margin-top:0}
.note-card .actions button{min-width:0}
.rich-editor{min-height:180px;max-height:none}
.rich-toolbar{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.rich-toolbar button{min-width:34px;padding:6px 8px}

/* Tables & long content. */
.table-wrap{max-width:100%;overflow:auto;-webkit-overflow-scrolling:touch}
table{min-width:100%}

/* Calculator/tool controls. */
.calc-category-tabs,.calc-categories{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.calc-tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}

/* Remove common legacy inline top margins that create needless holes inside packed grids. */
.grid>.card[style*="margin-top"],.grid>.hero[style*="margin-top"]{margin-top:0!important}

/* Desktop / large tablets. */
@media (min-width:1201px){
  .app{grid-template-columns:218px minmax(0,1fr)}
  .main{padding:12px 14px 24px}
}
@media (min-width:761px) and (max-width:1200px){
  .app{grid-template-columns:194px minmax(0,1fr)}
  .main{padding:10px 10px 22px}
  .row{gap:7px}
  .actions button{padding:7px 9px}
}

/* Tablet & mobile: no horizontal overflow; packed grids become 2 / 1 columns. */
@media (max-width:1050px){
  .app{display:block!important;padding-top:52px!important}
  .main{width:100%;padding:9px 9px calc(82px + env(safe-area-inset-bottom))}
}
@media (max-width:760px){
  .main{padding:8px 8px calc(82px + env(safe-area-inset-bottom))}
  .top{padding:9px 10px;margin-bottom:8px}
  .top-search{min-width:0!important;width:100%!important}
  .row{gap:6px}
  .row>.actions{margin-left:auto;max-width:52%}
  .actions{gap:5px}
  .actions button{min-height:38px;padding:7px 9px}
  .form,.formgrid{gap:7px}
  .note-filter-bar{grid-template-columns:1fr}
  .note-category-row{grid-template-columns:1fr}
  .calc-tools{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){
  .main{padding-left:6px;padding-right:6px}
  .card{padding:10px}
  .row{align-items:flex-start;flex-wrap:wrap}
  .row>.actions{width:auto;max-width:none;margin-left:auto;align-self:flex-start}
  .row>span:nth-last-of-type(1){max-width:100%}
  .calc-tools{grid-template-columns:1fr}
}
@media (max-width:390px){
  .main{padding-left:5px;padding-right:5px}
  .card{padding:9px}
  .row>.actions{width:100%;justify-content:flex-end}
  .actions button{min-height:36px;padding:6px 8px;font-size:11px}
}

/* Universal dark surfaces for all newly packed/relayout components. */
html[data-lifeos-mode="dark"] .card,
html[data-lifeos-mode="dark"] .note-card,
html[data-lifeos-mode="dark"] .item,
html[data-lifeos-mode="dark"] .routine,
html[data-lifeos-mode="dark"] .hero,
html[data-lifeos-mode="dark"] .module-hero,
html[data-lifeos-mode="dark"] .kpi-box,
html[data-lifeos-mode="dark"] .focus-stat,
html[data-lifeos-mode="dark"] .badge,
html[data-lifeos-mode="dark"] .ultra-main-card,
html[data-lifeos-mode="dark"] .ultra-side-card{background:var(--surface)!important;color:var(--text)!important;border-color:var(--line)!important}
html[data-lifeos-mode="dark"] .row{border-color:var(--line)}
html[data-lifeos-mode="dark"] input,
html[data-lifeos-mode="dark"] textarea,
html[data-lifeos-mode="dark"] select{background:#101720!important;color:var(--text)!important;border-color:var(--line)!important}
html[data-lifeos-mode="dark"] button:not(.primary):not(.danger){background:var(--surface2);color:var(--text);border-color:var(--line)}
</style>
<style id="om-lifeos-v43-design-system">
/* OM-LIFEOS v4.3 — Architecture-aligned design system.
   One semantic token layer + one layout/component layer. Existing domain markup remains compatible. */
:root{
  --ol-bg:#f3f5f8;--ol-surface:#fff;--ol-surface-2:#f8fafc;--ol-text:#172033;--ol-muted:#667085;
  --ol-line:#dfe4ea;--ol-accent:#5d57c9;--ol-accent-strong:#4942b5;--ol-success:#16834b;--ol-danger:#c23a3a;
  --ol-radius:14px;--ol-radius-sm:10px;--ol-gap:14px;--ol-shadow:0 8px 28px rgba(15,23,42,.06);
  --ol-sidebar:272px;--ol-content:1440px;
}
html,body{background:var(--ol-bg);color:var(--ol-text)}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
#nav{width:var(--ol-sidebar);background:#121822;border-right:1px solid rgba(255,255,255,.08)}
#content{width:min(100%,var(--ol-content));margin:0 auto;padding:22px}
.content{max-width:none}
.card,.panel,.note-editor,.note-list,.calc-sidebar,.calc-panel{border:1px solid var(--ol-line);border-radius:var(--ol-radius);background:var(--ol-surface);box-shadow:var(--ol-shadow)}
.card{padding:12px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:10px}
.grid>.span12,.grid>.span8,.grid>.span7{grid-column:span 4}
.grid>.span6,.grid>.span5{grid-column:span 2}
.grid>.span4,.grid>.span3{grid-column:span 1}
.grid.g3,.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.card,.panel,.note-editor,.note-list,.calc-sidebar,.calc-panel{min-width:0}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.form .full{grid-column:1/-1}
input,select,textarea{border:1px solid var(--ol-line);border-radius:var(--ol-radius-sm);background:#fff;color:var(--ol-text);min-height:40px}
button{border-radius:var(--ol-radius-sm);border:1px solid var(--ol-line);min-height:38px}
button.primary{background:var(--ol-accent);border-color:var(--ol-accent);color:#fff}
button.primary:hover{background:var(--ol-accent-strong)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.status{font-weight:650;color:var(--ol-success)}
.muted{color:var(--ol-muted)}
/* Reference calculator architecture: persistent sidebar + panel. */
#calculator .calc-grid,.calc-grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;align-items:start}
#calculator .calc-sidebar,.calc-sidebar{position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto}
#calculator .calc-panel,.calc-panel{min-width:0}
.calc-tool{border:0;text-align:left;width:100%}
/* Notes information architecture */
.note-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);gap:var(--ol-gap);align-items:start}
#noteCategory{min-width:0}
.note-editor .form{grid-template-columns:repeat(2,minmax(0,1fr))}
/* Consistent focus state */
:where(button,input,select,textarea,[tabindex]):focus-visible{outline:3px solid color-mix(in srgb,var(--ol-accent) 28%,transparent);outline-offset:2px}
@media(max-width:1100px){
  :root{--ol-sidebar:240px}
  .grid>.span12,.grid>.span8,.grid>.span7{grid-column:span 3}
  .grid>.span6,.grid>.span5{grid-column:span 2}
  .grid>.span4,.grid>.span3{grid-column:span 1}
  .note-grid{grid-template-columns:1fr}
}
@media(max-width:760px){
  #content{padding:14px}.grid{grid-template-columns:1fr}.grid>[class*="span"]{grid-column:1/-1}.grid.g3,.grid.three{grid-template-columns:1fr}.form,.note-editor .form{grid-template-columns:1fr}
  #calculator .calc-grid,.calc-grid{grid-template-columns:1fr}.calc-sidebar{position:static;max-height:none}.actions{align-items:stretch}.actions button{flex:1 1 auto}
}
</style>

<style id="v44-gap-fix">
/* Compact card spacing: remove unnecessary whitespace while preserving v2.2.4 grid proportions */
.grid{gap:6px;margin-bottom:6px}
.grid.g3,.grid.three{gap:6px}
.kpi-grid{gap:6px;margin-bottom:6px}
.two{gap:6px}
.note-grid{gap:6px}
.card{margin:0}
.hero,.module-hero{margin-bottom:6px}
.actions{gap:5px;margin-top:6px}
.list{gap:5px}
@media(max-width:760px){
  .grid,.grid.g3,.grid.three,.kpi-grid,.two,.note-grid{gap:6px}
}
@media(max-width:430px){
  .grid,.grid.g3,.grid.three,.kpi-grid,.two,.note-grid{gap:5px}
}
</style>
<style id="om-lifeos-card-layout-v1">
/* Unified card layout: JS performs masonry placement; CSS only supplies safe sizing. */
.grid.ol-masonry-active{display:block!important;position:relative!important;width:100%;min-width:0;}
.grid.ol-masonry-active>.card,
.grid.ol-masonry-active>.panel,
.grid.ol-masonry-active>.note-editor,
.grid.ol-masonry-active>.note-list,
.grid.ol-masonry-active>[class*="span"]{min-width:0;max-width:none;box-sizing:border-box;}
.grid.ol-masonry-active>.card>* ,
.grid.ol-masonry-active>.panel>*{min-width:0;max-width:100%;box-sizing:border-box;}
.grid.ol-masonry-active input,
.grid.ol-masonry-active select,
.grid.ol-masonry-active textarea,
.grid.ol-masonry-active button{max-width:100%;box-sizing:border-box;}
@media(max-width:760px){
  .grid.ol-masonry-active{display:block!important;}
  .grid.ol-masonry-active>[class*="span"]{max-width:100%;}
}
</style>

<style id="om-lifeos-final-theme-tabs">
  html{color-scheme:light}
  html[data-lifeos-mode="dark"]{color-scheme:dark}
  .theme-tabs{display:inline-flex;align-items:center;gap:4px;padding:4px;background:var(--surface2);border:1px solid var(--line);border-radius:12px}
  .theme-tabs button{min-height:36px;padding:7px 12px;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--muted);font-weight:800}
  .theme-tabs button.active{background:var(--surface);color:var(--text);border-color:var(--line);box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .theme-tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .theme-help{margin-top:7px;font-size:10px;color:var(--muted)}
  html[data-lifeos-mode="dark"] .top,
  html[data-lifeos-mode="dark"] .card,
  html[data-lifeos-mode="dark"] .item,
  html[data-lifeos-mode="dark"] .routine,
  html[data-lifeos-mode="dark"] .note-card,
