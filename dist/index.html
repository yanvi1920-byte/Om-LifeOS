<!doctype html><html lang="en"><head>
<meta name="om-lifeos-master" content="Om-LifeOS Master v4.2 universal compact responsive final build">
<meta name="om-lifeos-structure" content="Dashboard;Tasks & Planner;Routine & Habits;Goals & Strategy;Focus;Notes;Journal;Finance;Calculator & Tools;Health;Work & Learning;People & Relationships;Values & Spiritual;Things & Documents;Settings">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self';"><title>Om-LifeOS 4.2.0 — Universal Compact Final</title>













  <link rel="stylesheet" href="assets/app.css">
</head><body>
<div class="mobile-app-bar" id="mobileAppBar"><button aria-controls="mobileNavDrawer" aria-expanded="false" aria-label="Open navigation" id="mobileMenuButton" onclick="toggleMobileNav()" type="button">☰</button><div aria-hidden="true" class="mobile-brand-logo">ॐ</div><b class="mobile-brand-name">Om-LifeOS</b><span id="mobilePageTitle">Dashboard</span></div>
<div class="mobile-nav-backdrop" id="mobileNavBackdrop" onclick="toggleMobileNav(false)"></div>
<div class="app">
<aside class="side" id="mobileNavDrawer"><div class="sidebar-top-tools"><button type="button" class="sidebar-theme-toggle" id="sidebarThemeToggle" onclick="toggleTheme()" aria-label="Switch theme" title="Switch theme">☾</button><span class="muted">v4.7</span></div><div class="brand"><div aria-hidden="true" class="brand-logo">ॐ</div><div><b>Om-LifeOS</b><small>Personal life management</small></div></div><nav aria-label="LifeOS navigation" id="nav"></nav></aside>
<main class="main"><header class="top"><div style="min-width:180px"><h1 id="pageTitle">Dashboard</h1><div class="sub">Your complete local-first life system.</div></div><input class="top-search" id="search" placeholder="Search everything…" oninput="searchAll(this.value)" aria-label="Search everything"><button type="button" id="bsDateWidget" class="bs-date-widget" title="Nepali BS date • click for BS ↔ AD converter" aria-label="Nepali Bikram Sambat date" onclick="openBsDatePanel()"><span class="bs-date-widget-main" id="bsDateWidgetMain">BS —</span><span class="bs-date-widget-ad" id="bsDateWidgetAd">AD —</span></button><div class="top-actions">
  <button type="button" class="top-icon-action" title="Notifications" aria-label="Notifications" onclick="show('settings');setTimeout(()=>document.getElementById('settingsNotificationsCard')?.scrollIntoView({behavior:'smooth',block:'center'}),0)">🔔</button>
  <button type="button" class="top-icon-action" title="Achievements" aria-label="Achievements" onclick="show('dashboard');setTimeout(()=>document.querySelector('[data-dashboard-achievements]')?.scrollIntoView({behavior:'smooth',block:'center'}),0)">🏆</button>
  <button type="button" class="top-capture-action" onclick="capture()">＋ Capture</button>
  <div class="command-menu-wrap">
    <button class="command-menu-trigger" id="commandMenuTrigger" type="button" aria-expanded="false" aria-haspopup="menu" onclick="toggleCommandMenu()">⚡ Actions <span aria-hidden="true">⌄</span></button>
    <div class="command-menu" id="commandMenu" role="menu" aria-label="Quick actions">
      <button type="button" role="menuitem" onclick="capture();toggleCommandMenu(false)">＋ Quick Capture</button>
      <button type="button" role="menuitem" onclick="show('tasks');toggleCommandMenu(false)">✓ Tasks & Planner</button>
      <button type="button" role="menuitem" onclick="show('notes');toggleCommandMenu(false)">📝 Notes</button>
      <button type="button" role="menuitem" onclick="show('finance');toggleCommandMenu(false)">💰 Finance</button>
      <button type="button" role="menuitem" onclick="show('settings');toggleCommandMenu(false)">⚙ Settings</button>
    </div>
  </div>
</div></header><div id="content" class="content"></div></main>
</div>
<div class="mobile-bottom-nav" id="mobileBottomNav"><button data-bottom-nav="dashboard" onclick="show('dashboard')"><span class="mi">⌂</span><span>Home</span></button><button data-bottom-nav="tasks" onclick="show('tasks')"><span class="mi">✓</span><span>Tasks</span></button><button data-bottom-nav="routine" onclick="show('routine')"><span class="mi">◉</span><span>Habits</span></button><button data-bottom-nav="notes" onclick="show('notes')"><span class="mi">▤</span><span>Notes</span></button><button data-bottom-nav="settings" onclick="show('settings')"><span class="mi">⚙</span><span>More</span></button><button class="bottom-theme" id="bottomThemeToggle" onclick="toggleTheme()" aria-label="Switch theme" title="Switch theme"><span class="mi">☾</span><span>Theme</span></button></div>

<div id="bsDateModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="bsDateModalTitle" onclick="if(event.target===this)closeBsDatePanel()"><div class="bs-date-panel"><div class="modal-head"><div><h2 id="bsDateModalTitle">🇳🇵 BS ↔ AD Date</h2><div class="muted">Bikram Sambat and Gregorian dates stay linked automatically.</div></div><button type="button" class="secondary" onclick="closeBsDatePanel()">Close</button></div><div class="bs-date-panel-grid" style="margin-top:10px"><label><span class="label">BS date</span><input id="bsDateInput" type="text" inputmode="numeric" placeholder="2083-06-08" aria-label="BS date YYYY-MM-DD"></label><label><span class="label">AD date</span><input id="adDateInput" type="date" aria-label="AD date"></label></div><div class="actions" style="margin-top:9px"><button type="button" class="primary" onclick="convertBsToAdUi()">BS → AD</button><button type="button" class="secondary" onclick="convertAdToBsUi()">AD → BS</button><button type="button" class="secondary" onclick="setBsTodayUi()">Today</button></div><div id="bsDateResult" class="bs-date-panel-result" aria-live="polite"></div></div></div>
<div id="toast" class="toast"></div><div id="entityModal" class="modal-backdrop" onclick="if(event.target===this)closeEntityModal()"></div>




  <script src="assets/app.js"></script>
</body></html>
